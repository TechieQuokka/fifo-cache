<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="nodeVisited" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bbf7d0"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </linearGradient>
    <linearGradient id="nodeUnvisited" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="100%" style="stop-color:#fca5a5"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">SIEVE Cache Algorithm</text>
  <text x="450" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Simpler than LRU: One FIFO Queue + One Pointer</text>

  <!-- HEAD Label -->
  <g filter="url(#shadow)">
    <rect x="60" y="85" width="80" height="45" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="100" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">HEAD</text>
  <text x="100" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">(newest)</text>

  <!-- TAIL Label -->
  <g filter="url(#shadow)">
    <rect x="760" y="85" width="80" height="45" rx="8" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
  </g>
  <text x="800" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">TAIL</text>
  <text x="800" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c7d2fe">(oldest)</text>

  <!-- Connection line -->
  <line x1="145" y1="107" x2="755" y2="107" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Queue Nodes -->
  <!-- Node A (visited) -->
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="90" height="85" rx="10" fill="url(#nodeVisited)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="115" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Object A</text>
  <circle cx="115" cy="205" r="15" fill="#16a34a"/>
  <text x="115" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">1</text>
  <text x="115" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">visited</text>

  <!-- Arrow A-B -->
  <path d="M 165 197 L 195 197" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="180" cy="197" r="3" fill="#94a3b8"/>

  <!-- Node B (unvisited) -->
  <g filter="url(#shadow)">
    <rect x="200" y="155" width="90" height="85" rx="10" fill="url(#nodeUnvisited)" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="245" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Object B</text>
  <circle cx="245" cy="205" r="15" fill="#dc2626"/>
  <text x="245" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">0</text>
  <text x="245" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">unvisited</text>

  <!-- Arrow B-C -->
  <path d="M 295 197 L 325 197" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="310" cy="197" r="3" fill="#94a3b8"/>

  <!-- Node C (visited) -->
  <g filter="url(#shadow)">
    <rect x="330" y="155" width="90" height="85" rx="10" fill="url(#nodeVisited)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="375" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Object C</text>
  <circle cx="375" cy="205" r="15" fill="#16a34a"/>
  <text x="375" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">1</text>
  <text x="375" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">visited</text>

  <!-- Arrow C-D -->
  <path d="M 425 197 L 455 197" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="440" cy="197" r="3" fill="#94a3b8"/>

  <!-- Node D (unvisited) - HAND points here -->
  <g filter="url(#glow)">
    <rect x="460" y="155" width="90" height="85" rx="10" fill="url(#nodeUnvisited)" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="505" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Object D</text>
  <circle cx="505" cy="205" r="15" fill="#dc2626"/>
  <text x="505" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">0</text>
  <text x="505" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">unvisited</text>

  <!-- Arrow D-E -->
  <path d="M 555 197 L 585 197" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="570" cy="197" r="3" fill="#94a3b8"/>

  <!-- Node E (visited) -->
  <g filter="url(#shadow)">
    <rect x="590" y="155" width="90" height="85" rx="10" fill="url(#nodeVisited)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="635" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Object E</text>
  <circle cx="635" cy="205" r="15" fill="#16a34a"/>
  <text x="635" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">1</text>
  <text x="635" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">visited</text>

  <!-- Arrow E-F -->
  <path d="M 685 197 L 715 197" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="700" cy="197" r="3" fill="#94a3b8"/>

  <!-- Node F (unvisited) -->
  <g filter="url(#shadow)">
    <rect x="720" y="155" width="90" height="85" rx="10" fill="url(#nodeUnvisited)" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="765" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Object F</text>
  <circle cx="765" cy="205" r="15" fill="#dc2626"/>
  <text x="765" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">0</text>
  <text x="765" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">unvisited</text>

  <!-- HAND Pointer -->
  <g filter="url(#shadow)">
    <rect x="465" y="270" width="80" height="40" rx="8" fill="url(#handGrad)" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="505" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">HAND</text>
  <path d="M 505 270 L 505 245" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Hand movement arrow -->
  <path d="M 460 290 C 400 290 350 260 350 230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="275" font-family="system-ui, sans-serif" font-size="10" fill="#d97706">scan direction</text>

  <!-- INSERT Arrow -->
  <path d="M 30 197 L 65 197" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="30" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">INSERT</text>

  <!-- EVICT Arrow -->
  <path d="M 815 197 L 870 197" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="855" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">EVICT</text>

  <!-- Eviction Process Section -->
  <rect x="50" y="330" width="800" height="150" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#374151">Eviction Process</text>

  <!-- Step 1 -->
  <rect x="70" y="370" width="220" height="90" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="180" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#854d0e">Step 1: Check Hand</text>
  <text x="180" y="410" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">if visited == 1:</text>
  <text x="180" y="425" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">  reset to 0</text>
  <text x="180" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">  move hand ← (toward head)</text>

  <!-- Arrow 1-2 -->
  <path d="M 295 415 L 325 415" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="330" y="370" width="220" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Step 2: Find Victim</text>
  <text x="440" y="410" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">while visited == 1:</text>
  <text x="440" y="425" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">  continue scanning</text>
  <text x="440" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">found visited == 0!</text>

  <!-- Arrow 2-3 -->
  <path d="M 555 415 L 585 415" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="590" y="370" width="220" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="700" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Step 3: Evict</text>
  <text x="700" y="410" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">remove node from list</text>
  <text x="700" y="425" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">remove from hash index</text>
  <text x="700" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">move hand ← (continue)</text>

</svg>