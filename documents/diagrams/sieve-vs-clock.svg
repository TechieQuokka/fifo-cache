<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="100%" style="stop-color:#fca5a5"/>
    </linearGradient>
    <linearGradient id="sieveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bbf7d0"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SIEVE vs CLOCK: The Critical Difference</text>

  <!-- CLOCK Section -->
  <rect x="30" y="50" width="410" height="310" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="30" y="50" width="410" height="40" rx="12" fill="url(#clockGrad)"/>
  <rect x="30" y="78" width="410" height="12" fill="url(#clockGrad)"/>
  <text x="235" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">CLOCK Algorithm</text>

  <!-- CLOCK Before -->
  <text x="50" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Before eviction:</text>
  <g filter="url(#shadow)">
    <rect x="50" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="75" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">A:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="110" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="135" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">B:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="195" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">C:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="255" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">D:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="315" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">E:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="375" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">F:0</text>
  </g>
  <!-- Hand pointer -->
  <path d="M 255 165 L 255 175" stroke="#dc2626" stroke-width="2"/>
  <polygon points="255,180 250,172 260,172" fill="#dc2626"/>
  <text x="255" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">HAND</text>

  <!-- Arrow down -->
  <path d="M 235 210 L 235 230" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">evict D</text>

  <!-- CLOCK After -->
  <text x="50" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">After eviction:</text>
  <g filter="url(#shadow)">
    <rect x="50" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="75" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">A:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="110" y="265" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="135" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">B:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="195" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">C:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="265" width="50" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="255" y="287" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#166534">NEW</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="315" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">E:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="265" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="375" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">F:0</text>
  </g>

  <!-- Problem highlight -->
  <rect x="50" y="310" width="380" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="240" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">Problem: NEW object inserted at eviction point</text>
  <text x="240" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">→ Mixes with old objects, loses temporal ordering</text>

  <!-- SIEVE Section -->
  <rect x="460" y="50" width="410" height="310" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <rect x="460" y="50" width="410" height="40" rx="12" fill="url(#sieveGrad)"/>
  <rect x="460" y="78" width="410" height="12" fill="url(#sieveGrad)"/>
  <text x="665" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#166534">SIEVE Algorithm</text>

  <!-- SIEVE Before -->
  <text x="480" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Before eviction:</text>
  <g filter="url(#shadow)">
    <rect x="480" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="505" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">A:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="565" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">B:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="625" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">C:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="685" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">D:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="125" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="745" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">E:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="125" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="805" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">F:0</text>
  </g>
  <!-- Hand pointer -->
  <path d="M 685 165 L 685 175" stroke="#16a34a" stroke-width="2"/>
  <polygon points="685,180 680,172 690,172" fill="#16a34a"/>
  <text x="685" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">HAND</text>

  <!-- Arrow down -->
  <path d="M 665 210 L 665 230" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="710" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">evict D</text>

  <!-- SIEVE After -->
  <text x="480" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">After eviction:</text>
  <g filter="url(#shadow)">
    <rect x="480" y="265" width="50" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="505" y="287" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#166534">NEW</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="565" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">A:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="265" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="625" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">B:0</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="685" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">C:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="265" width="50" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="745" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">E:1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="265" width="50" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="805" y="287" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">F:0</text>
  </g>

  <!-- Solution highlight -->
  <rect x="480" y="310" width="380" height="40" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="670" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Solution: NEW object always at HEAD</text>
  <text x="670" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">→ Old/new objects stay separated, preserves ordering</text>

</svg>